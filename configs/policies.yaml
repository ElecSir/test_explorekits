# Конфиг политик ExploreKit (Участник 1).
# Общее правило: алгоритмические параметры не хардкодить, всё вынесено сюда.

# Глобальный seed для воспроизводимости. Политики наследуют его,
# если у них не задан свой. Отдельный seed нужен только для
# специальных экспериментов (например, smoke с фиксированным поведением).
seed: 42

# Активная политика. Меняешь это поле — меняется политика, код не трогаем.
active_policy: linucb

policies:
  # ── Боевые политики (n_actions=80, реальный прогон) ──

  epsilon_greedy:
    type: epsilon_greedy
    n_actions: 80
    # epsilon клипается в [min_epsilon, max_epsilon]: если в эксперименте
    # выставить epsilon=0.5, а max_epsilon=0.3, то фактически будет 0.3.
    # Это защита от слишком агрессивного exploration.
    epsilon: 0.10
    min_epsilon: 0.01
    max_epsilon: 0.30
    # Ограничения множества действий. null = без ограничений.
    # whitelist/blacklist — int-индексы айтемов, не категории.
    whitelist: null
    blacklist: null
    # exploration_subset — если задан, ε размазывается только по нему.
    # Используется для раскрутки конкретной группы айтемов.
    exploration_subset: null

  linucb:
    type: linucb
    n_actions: 80
    context_dim: 3
    # alpha — коэффициент UCB-бонуса. 0 = чистый exploitation,
    # больше = агрессивнее исследование.
    alpha: 1.0
    # temperature — как политика ДЕЙСТВУЕТ (select_action).
    # ope_temperature — как её ОЦЕНИВАЕМ офлайн (action_distribution).
    # Разделены, потому что резкий softmax (temperature=0.1) даёт
    # пропенсити ~1e-44 для не-argmax действий, что убивает ESS
    # и делает OPE ненадёжным.
    temperature: 0.1
    ope_temperature: 1.0
    # reg — регуляризация prior: A[a] = reg · I. Меньше = быстрее
    # сходится, но более шумно.
    reg: 1.0
    whitelist: null
    blacklist: null

  thompson:
    type: thompson
    n_actions: 80
    context_dim: 3
    # mc_samples — число сэмплов для Monte Carlo оценки propensity.
    # 200–500 из ТЗ. Больше = точнее, но медленнее.
    mc_samples: 200
    reg: 1.0
    whitelist: null
    blacklist: null

  # ── Smoke-политики (n_actions=5, быстрая проверка) ──
  # seed=0 задан явно: важно, чтобы smoke был воспроизводим независимо
  # от изменений глобального seed. Если поменяешь глобальный seed
  # для эксперимента, smoke продолжит работать стабильно.

  smoke_epsilon_greedy:
    type: epsilon_greedy
    n_actions: 5
    # epsilon=1.0 — чтобы поведение совпало с uniform behavior policy
    # и можно было проверить, что IPS(uniform) == mean(reward).
    epsilon: 1.0
    min_epsilon: 0.0
    max_epsilon: 1.0
    seed: 0

  smoke_linucb:
    type: linucb
    n_actions: 5
    context_dim: 3
    # alpha и reg уменьшены по сравнению с боевыми: на 5 действиях
    # и 2000 шагах так быстрее сходится.
    alpha: 0.1
    temperature: 0.1
    ope_temperature: 1.0
    reg: 0.1
    seed: 0

  smoke_thompson:
    type: thompson
    n_actions: 5
    context_dim: 3
    mc_samples: 200
    reg: 1.0
    seed: 0