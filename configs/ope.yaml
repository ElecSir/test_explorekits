# Конфиг OPE-модуля (участник 2).
# Общее правило №4: алгоритмические параметры не хардкодить.

seed: 42

ope:
  # Верхняя граница importance weight. null = без клиппинга.
  # Ставится по диагностике: если fraction_clipped уходит выше ~5%,
  # смещение от обрезки становится существенным.
  max_weight: 15.0

bootstrap:
  n_bootstrap: 1000
  confidence_level: 0.95

reward_model:
  # Для прототипа достаточно LogisticRegression (по ТЗ).
  C: 1.0
  max_iter: 1000
  # Доля логов, уходящая на обучение q_hat. Остальное — на честную оценку,
  # чтобы DR не подглядывал в те же данные, на которых считается.
  train_fraction: 0.5

diagnostics:
  # Пороги статусов Reliable / Use with caution / Unreliable.
  ess_ratio_caution: 0.20
  ess_ratio_unreliable: 0.05
  clipped_fraction_caution: 0.05
  support_violation_caution: 0.01

synthetic_validation:
  n_replications: 50
  n_rounds: 5000
  # Bootstrap внутри валидации можно уменьшить: там важна доля покрытий
  # по многим прогонам, а не точность отдельного интервала.
  n_bootstrap: 200
  epsilon: 0.1

open_bandit:
  data_dir: data/obd
  campaign: all
  behavior_policy: random
  # Оцениваемые политики exploration (presets, см. участника 3).
  evaluation_epsilons:
    conservative: 0.05
    moderate: 0.10
    aggressive: 0.25
